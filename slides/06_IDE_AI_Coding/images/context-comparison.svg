<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <!-- Background -->
  <rect width="900" height="480" fill="white"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Context Pipelines: Claude Web vs IDE AI</text>

  <!-- Divider line -->
  <line x1="450" y1="48" x2="450" y2="460" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- LEFT: Claude Web -->
  <text x="225" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#C8102E">Claude Web</text>

  <!-- User box -->
  <rect x="155" y="86" width="140" height="36" rx="6" fill="#C8102E"/>
  <text x="225" y="109" text-anchor="middle" font-size="13" fill="white" font-weight="bold">You (the user)</text>

  <!-- Arrow -->
  <line x1="225" y1="122" x2="225" y2="142" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Conversation box -->
  <rect x="125" y="144" width="200" height="60" rx="6" fill="#FFF0F0" stroke="#C8102E" stroke-width="1.5"/>
  <text x="225" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Conversation</text>
  <text x="225" y="181" text-anchor="middle" font-size="10" fill="#666">Paste code, describe problems,</text>
  <text x="225" y="194" text-anchor="middle" font-size="10" fill="#666">upload files, share context</text>

  <!-- Arrow -->
  <line x1="225" y1="204" x2="225" y2="224" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM box -->
  <rect x="165" y="226" width="120" height="36" rx="6" fill="#333"/>
  <text x="225" y="249" text-anchor="middle" font-size="13" fill="white" font-weight="bold">LLM</text>

  <!-- Arrow -->
  <line x1="225" y1="262" x2="225" y2="282" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Response box -->
  <rect x="155" y="284" width="140" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="225" y="307" text-anchor="middle" font-size="12" fill="#333">Response in chat</text>

  <!-- Key label -->
  <rect x="130" y="340" width="190" height="34" rx="17" fill="#C8102E"/>
  <text x="225" y="362" text-anchor="middle" font-size="12" fill="white" font-weight="bold">You are the context engine</text>

  <!-- Manual note -->
  <text x="225" y="400" text-anchor="middle" font-size="10" fill="#888">You decide what the AI sees.</text>
  <text x="225" y="414" text-anchor="middle" font-size="10" fill="#888">Context = what you paste + describe.</text>

  <!-- RIGHT: IDE AI -->
  <text x="675" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#C8102E">IDE AI</text>

  <!-- Codebase box -->
  <rect x="605" y="86" width="140" height="36" rx="6" fill="#C8102E"/>
  <text x="675" y="109" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Your Codebase</text>

  <!-- Arrow -->
  <line x1="675" y1="122" x2="675" y2="142" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Automatic context box -->
  <rect x="560" y="144" width="230" height="88" rx="6" fill="#FFF0F0" stroke="#C8102E" stroke-width="1.5"/>
  <text x="675" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Automatic Context</text>
  <text x="675" y="180" text-anchor="middle" font-size="10" fill="#666">Open tabs &amp; cursor position</text>
  <text x="675" y="194" text-anchor="middle" font-size="10" fill="#666">Import graph analysis</text>
  <text x="675" y="208" text-anchor="middle" font-size="10" fill="#666">Embeddings index &amp; semantic search</text>
  <text x="675" y="222" text-anchor="middle" font-size="10" fill="#666">Rules files &amp; custom instructions</text>

  <!-- Arrow -->
  <line x1="675" y1="232" x2="675" y2="252" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Prompt assembly box -->
  <rect x="610" y="254" width="130" height="36" rx="6" fill="#555"/>
  <text x="675" y="277" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Prompt Assembly</text>

  <!-- Arrow -->
  <line x1="675" y1="290" x2="675" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM box -->
  <rect x="615" y="312" width="120" height="36" rx="6" fill="#333"/>
  <text x="675" y="335" text-anchor="middle" font-size="13" fill="white" font-weight="bold">LLM</text>

  <!-- Arrow -->
  <line x1="675" y1="348" x2="675" y2="368" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Suggestion box -->
  <rect x="590" y="370" width="170" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="675" y="393" text-anchor="middle" font-size="12" fill="#333">Suggestion in-place</text>

  <!-- Key label -->
  <rect x="575" y="420" width="200" height="34" rx="17" fill="#C8102E"/>
  <text x="675" y="442" text-anchor="middle" font-size="12" fill="white" font-weight="bold">The tool is the context engine</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
</svg>